name: auth-runtime-secret-provisioning

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm synchronizing Auth GitHub Environment secrets to Kubernetes"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: auth-runtime-secret-provisioning
  cancel-in-progress: false

jobs:
  provision:
    if: ${{ inputs.confirm == 'yes' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH tunnel to K3s
        env:
          SSH_KEY: ${{ secrets.AUTH_SECRET_PROVISION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "::error::Missing AUTH_SECRET_PROVISION_SSH_PRIVATE_KEY in the Auth repository production environment."; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\\n' "$SSH_KEY" | tr -d '\\r' > ~/.ssh/auth_secret_provision_key
          chmod 600 ~/.ssh/auth_secret_provision_key
          ssh -i ~/.ssh/auth_secret_provision_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@132.226.175.206 'sudo test -r /etc/rancher/k3s/k3s.yaml'
          ssh -i ~/.ssh/auth_secret_provision_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no ubuntu@132.226.175.206 'sudo cat /etc/rancher/k3s/k3s.yaml' > /tmp/k3s-auth.yaml
          chmod 600 /tmp/k3s-auth.yaml
          ssh -fNT -i ~/.ssh/auth_secret_provision_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -L 6443:127.0.0.1:6443 ubuntu@132.226.175.206
          echo "KUBECONFIG=/tmp/k3s-auth.yaml" >> "$GITHUB_ENV"

      - name: Validate Auth runtime credentials
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          [[ "$SUPABASE_URL" =~ ^https://[^/]+$ ]] || { echo "::error::SUPABASE_URL must be configured as a production environment variable."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY."; exit 1; }
          test "${#JWT_SECRET}" -ge 32 || { echo "::error::JWT_SECRET must contain at least 32 characters/bytes."; exit 1; }
          decoded_mfa="$(printf '%s' "$MFA_ENCRYPTION_KEY" | base64 --decode 2>/dev/null | wc -c | tr -d ' ')"
          test "$decoded_mfa" = "32" || { echo "::error::MFA_ENCRYPTION_KEY must be Base64-encoded 32 bytes."; exit 1; }
          echo "Auth runtime credential shape validated; values were not printed."

      - name: Apply Kubernetes runtime Secret
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file" ~/.ssh/auth_secret_provision_key /tmp/k3s-auth.yaml' EXIT
          chmod 600 "$secret_file"
          {
            printf 'SUPABASE_URL=%s\\n' "$SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'JWT_SECRET=%s\\n' "$JWT_SECRET"
            printf 'MFA_ENCRYPTION_KEY=%s\\n' "$MFA_ENCRYPTION_KEY"
          } > "$secret_file"
          kubectl apply -f platform/microfe/namespace.yaml 2>/dev/null || kubectl create namespace microfe-platform
          kubectl -n microfe-platform create secret generic microfe-auth-secrets \\
            --from-env-file="$secret_file" \\
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n microfe-platform get secret microfe-auth-secrets -o json | jq -e '
            .data.SUPABASE_URL != null and
            .data.SUPABASE_SERVICE_ROLE_KEY != null and
            .data.JWT_SECRET != null and
            .data.MFA_ENCRYPTION_KEY != null
          ' >/dev/null
          echo "Kubernetes Secret microfe-auth-secrets provisioned and verified; credential values were not printed."
