name: auth-service-release

'on':
  push:
    branches: [master]
    paths:
      - src/**
      - test/**
      - package.json
      - nest-cli.json
      - tsconfig.json
      - Dockerfile
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: auth-service-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify auth service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  publish:
    name: Build and publish immutable ARM64 image
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: [verify]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/microfe-auth
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/auth-image.json \
            --push \
            --tag "$IMAGE:$TAG" \
            --file Dockerfile .
          DIGEST="$(node -e "const d=require('/tmp/auth-image.json')['containerimage.digest']; if(typeof d!=='string'||!/^sha256:[0-9a-f]{64}$/.test(d))process.exit(1); process.stdout.write(d)")"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE@$DIGEST"
