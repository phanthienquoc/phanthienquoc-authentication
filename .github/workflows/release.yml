name: auth-service-release

'on':
  # Production image publication and GitOps promotion require an explicit,
  # auditable manual dispatch from master. Ordinary pushes only run CI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-service-release
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: Require master for production release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject non-master production releases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Auth production release must be manually dispatched from refs/heads/master; refusing image publication and GitOps promotion."
            exit 1
          fi
          echo "Auth release ref is master."

  verify:
    needs: validate-release-ref
    name: Verify auth service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  publish:
    name: Build and publish ARM64 image with version and SHA tags
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: [validate-release-ref, verify]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Auth owns application build/release only. Production runtime secrets are stored
      # in platform-infra's protected production Environment and provisioned there.
      # Never pass runtime secret values through this repository or dispatch payloads.
      # Validate promotion prerequisites before publishing.
      - name: Validate release and promotion contract
        id: release-contract
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_INFRA_DISPATCH_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing PLATFORM_INFRA_DISPATCH_TOKEN; refusing to publish an image that cannot request GitOps promotion."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be stable semver (x.y.z); got: $VERSION"
            exit 1
          fi
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected a full immutable Git SHA"; exit 1; }
          RELEASE_TAG="prod-v${VERSION}-${TAG}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Validated release contract: $RELEASE_TAG"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Refuse to overwrite existing immutable Auth GHCR tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/auth-service/auth
          SHA_TAG: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release-contract.outputs.release_tag }}
        run: bash scripts/verify-ghcr-tags-absent.sh "$IMAGE" "$SHA_TAG" "$RELEASE_TAG"
      - name: Build and publish image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/auth-service/auth
          TAG: ${{ github.sha }}
          VERSION: ${{ steps.release-contract.outputs.version }}
          RELEASE_TAG: ${{ steps.release-contract.outputs.release_tag }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/auth-image.json \
            --push \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:$RELEASE_TAG" \
            --file Dockerfile .
          DIGEST="$(node -e "const d=require('/tmp/auth-image.json')['containerimage.digest']; if(typeof d!=='string'||!/^sha256:[0-9a-f]{64}$/.test(d))process.exit(1); process.stdout.write(d)")"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE:$TAG and $IMAGE:$RELEASE_TAG ($DIGEST)"

      - name: Verify published digest and ARM64 manifest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          RELEASE_TAG: ${{ steps.image.outputs.release_tag }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Buildx did not return a valid immutable Auth registry digest."
            exit 1
          }
          for tag in "$SHA_TAG" "$RELEASE_TAG"; do
            inspect="$(docker buildx imagetools inspect "$IMAGE:$tag")"
            actual_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspect")"
            [[ "$actual_digest" == "$EXPECTED_DIGEST" ]] || {
              echo "::error::Auth image tag $tag resolved to $actual_digest, expected $EXPECTED_DIGEST."
              exit 1
            }
            grep -Eq 'Platform: linux/arm64|linux/arm64' <<< "$inspect" || {
              echo "::error::Auth image tag $tag has no linux/arm64 manifest."
              exit 1
            }
          done
          echo "Verified both immutable Auth tags resolve to $EXPECTED_DIGEST with linux/arm64."

      - name: Build and validate exact Auth repository-dispatch payload
        id: dispatch-payload
        env:
          TAG: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release-contract.outputs.release_tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_WORKFLOW_PATH: .github/workflows/release.yml
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_EVENT" == "workflow_dispatch" ]] || {
            echo "::error::Auth production publisher must originate from workflow_dispatch."
            exit 1
          }
          [[ "$TAG" =~ ^[0-9a-f]{40}$ && "$SOURCE_HEAD_SHA" == "$TAG" ]] || {
            echo "::error::Auth publisher source SHA must be a full 40-character commit."
            exit 1
          }
          [[ "$RELEASE_TAG" == "prod-v${{ steps.release-contract.outputs.version }}-$TAG" ]] || {
            echo "::error::Auth versioned release tag must include the full source SHA."
            exit 1
          }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Auth source run ID is invalid."
            exit 1
          }
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Auth source run attempt is invalid."
            exit 1
          }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Auth registry digest is invalid."
            exit 1
          }

          PAYLOAD_FILE="$RUNNER_TEMP/auth-image-published.json"
          payload="$(jq -cn \
            --arg app "auth-service" \
            --arg component "auth" \
            --arg commit "$TAG" \
            --arg tag "$RELEASE_TAG" \
            --arg auth_digest "$DIGEST" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_run_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg source_workflow_path "$SOURCE_WORKFLOW_PATH" \
            --arg source_event "$SOURCE_EVENT" \
            --arg source_head_sha "$SOURCE_HEAD_SHA" \
            '{event_type:"auth-image-published",client_payload:{app:$app,component:$component,commit:$commit,tag:$tag,auth_digest:$auth_digest,source_run_id:$source_run_id,source_run_attempt:$source_run_attempt,source_workflow_path:$source_workflow_path,source_event:$source_event,source_head_sha:$source_head_sha}}')"
          printf '%s\n' "$payload" > "$PAYLOAD_FILE"

          jq -e \
            --arg app "auth-service" \
            --arg component "auth" \
            --arg commit "$TAG" \
            --arg tag "$RELEASE_TAG" \
            --arg auth_digest "$DIGEST" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_run_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg source_workflow_path "$SOURCE_WORKFLOW_PATH" \
            --arg source_event "$SOURCE_EVENT" \
            --arg source_head_sha "$SOURCE_HEAD_SHA" \
            '
              keys == ["client_payload", "event_type"]
              and .event_type == "auth-image-published"
              and (.client_payload | keys == ["app", "auth_digest", "commit", "component", "source_event", "source_head_sha", "source_run_attempt", "source_run_id", "source_workflow_path", "tag"])
              and .client_payload.app == $app
              and .client_payload.component == $component
              and .client_payload.commit == $commit
              and .client_payload.tag == $tag
              and .client_payload.auth_digest == $auth_digest
              and (.client_payload.auth_digest | test("^sha256:[0-9a-f]{64}$"))
              and .client_payload.source_run_id == $source_run_id
              and (.client_payload.source_run_id | test("^[1-9][0-9]*$"))
              and .client_payload.source_run_attempt == $source_run_attempt
              and (.client_payload.source_run_attempt | test("^[1-9][0-9]*$"))
              and .client_payload.source_workflow_path == $source_workflow_path
              and .client_payload.source_event == "workflow_dispatch"
              and .client_payload.source_event == $source_event
              and .client_payload.source_head_sha == $source_head_sha
              and (.client_payload.commit | test("^[0-9a-f]{40}$"))
              and .client_payload.commit == .client_payload.source_head_sha
            ' "$PAYLOAD_FILE" >/dev/null

          {
            echo "### Auth promotion dispatch payload"
            echo "- Event: auth-image-published"
            echo "- Source run: $SOURCE_RUN_ID (attempt $SOURCE_RUN_ATTEMPT)"
            echo "- Source SHA: $SOURCE_HEAD_SHA"
            echo "- Registry digest: $DIGEST"
            echo "- Exact payload schema: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Request Auth image promotion in platform-infra
        if: steps.dispatch-payload.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_INFRA_DISPATCH_TOKEN }}
          PAYLOAD_FILE: ${{ runner.temp }}/auth-image-published.json
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            --input "$PAYLOAD_FILE" \
            "/repos/phanthienquoc/platform-infra/dispatches"
          echo "Requested digest-pinned GitOps promotion for Auth."
