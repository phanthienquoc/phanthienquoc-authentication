name: auth-service-release

'on':
  # Production image publication and GitOps promotion require an explicit,
  # auditable manual dispatch from master. Ordinary pushes only run CI.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: auth-service-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify auth service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  publish:
    name: Build and publish ARM64 image with version and SHA tags
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: [verify]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Auth owns application build/release only. Production runtime secrets are stored
      # in platform-infra's protected production Environment and provisioned there.
      # Never pass runtime secret values through this repository or dispatch payloads.
      # Validate promotion prerequisites before publishing.
      - name: Validate release and promotion contract
        id: release-contract
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_INFRA_DISPATCH_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing PLATFORM_INFRA_DISPATCH_TOKEN; refusing to publish an image that cannot request GitOps promotion."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be stable semver (x.y.z); got: $VERSION"
            exit 1
          fi
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected a full immutable Git SHA"; exit 1; }
          SHORT_SHA="${TAG:0:7}"
          RELEASE_TAG="prod-v${VERSION}-${SHORT_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Validated release contract: $RELEASE_TAG"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/auth-service/auth
          TAG: ${{ github.sha }}
          VERSION: ${{ steps.release-contract.outputs.version }}
          RELEASE_TAG: ${{ steps.release-contract.outputs.release_tag }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/auth-image.json \
            --push \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:$RELEASE_TAG" \
            --file Dockerfile .
          DIGEST="$(node -e "const d=require('/tmp/auth-image.json')['containerimage.digest']; if(typeof d!=='string'||!/^sha256:[0-9a-f]{64}$/.test(d))process.exit(1); process.stdout.write(d)")"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE:$TAG and $IMAGE:$RELEASE_TAG ($DIGEST)"

      - name: Request Auth image promotion in platform-infra
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_INFRA_DISPATCH_TOKEN }}
          TAG: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release-contract.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/phanthienquoc/platform-infra/dispatches" \
            -f event_type="image-published" \
            -f "client_payload[app]=auth-service" \
            -f "client_payload[component]=auth" \
            -f "client_payload[tag]=$RELEASE_TAG"
          echo "Requested GitOps promotion for Auth image tag $RELEASE_TAG (immutable SHA: $TAG)"
