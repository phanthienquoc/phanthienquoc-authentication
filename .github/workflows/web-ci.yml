name: auth-web-ci

on:
  push:
    branches: [master, "feat/**", "fix/**"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package.json
      - name: Generate a complete optional-dependency lock
        run: npm install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
      - name: Install from the generated lock including optional platform packages
        run: npm ci --include=optional --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Build frontend container
        run: docker build --tag auth-web:ci -f Dockerfile .
