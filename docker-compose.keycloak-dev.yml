services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set KC_BOOTSTRAP_ADMIN_USERNAME in local environment}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in local environment}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-mrcute-dev.json:/opt/keycloak/data/import/mrcute-realm.json:ro
    restart: unless-stopped
